[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freqtrade-crypto-bot"
version = "0.1.0"
description = "Algorithmic crypto-trading toolkit: a Freqtrade strategy, a production-style config, and a deterministic market-regime signal engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Atul Kumar Singh" }]
keywords = [
    "freqtrade",
    "crypto",
    "algorithmic-trading",
    "trading-bot",
    "ta-lib",
    "quantitative-trading",
    "technical-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# The signal_engine package is pure standard library, so it has no hard runtime
# dependencies. Freqtrade and TA-Lib (needed only for the strategy) live in
# requirements.txt because TA-Lib requires a native C library first.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "black>=24.4",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/atulkumarsingh712-stack/freqtrade-crypto-bot"
Issues = "https://github.com/atulkumarsingh712-stack/freqtrade-crypto-bot/issues"
Source = "https://github.com/atulkumarsingh712-stack/freqtrade-crypto-bot"

[tool.setuptools]
packages = ["signal_engine"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["user_data", ".git"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
